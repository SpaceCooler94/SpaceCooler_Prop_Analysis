name: board
on:
  schedule:
    - cron: "0 15,19,22 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/board.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - run: |
          git config user.name "board-bot"
          git config user.email "board-bot@users.noreply.github.com"
          git add docs/data logs
          git diff --staged --quiet || git commit -m "board update" && git push
